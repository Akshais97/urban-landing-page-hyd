<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8d9b6">
  <meta name="description" content="Discover The Lifescape by Urbanrise, from the landscaped terraces of The Living Wave to the spaces that bring the community together.">
  <title>The Lifescape | Urbanrise</title>
  <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%lifescape-favicon.png">
  <link rel="stylesheet" href="/src/styles.css">
  <script>
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches ||
          navigator.connection?.saveData || (location.hash && location.hash !== '#home')) return;
      const root = document.documentElement;
      root.dataset.heroFilm = 'opening';
      root.classList.add('hero-opening');
      setTimeout(() => {
        if (!root.hasAttribute('data-hero-ready')) {
          root.dataset.heroFilm = 'still';
          root.classList.remove('hero-opening');
        }
      }, 1800);
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" class="experience-icons" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></symbol>
  </svg>
  <div class="experience-hero" id="home" tabindex="-1">
  <header class="hero abundance-hero" data-scene-root aria-labelledby="hero-title">
    <div class="bg abundance-scene" aria-hidden="true">
      <div class="abundance-layer">
        <img class="abundance-frame abundance-plate" src="%BASE_URL%hero/golden-hour.webp"
          width="1920" height="1080" alt="" fetchpriority="high">
        <div class="abundance-frame abundance-poster"></div>
        <canvas class="abundance-frame abundance-sample" width="480" height="270"></canvas>
      </div>
      <div class="abundance-scrim abundance-scrim--lens"></div>
    </div>
    <div class="abundance-film" aria-hidden="true">
      <div class="abundance-layer">
        <video class="abundance-frame" muted playsinline preload="none" disablepictureinpicture
          data-webm="%BASE_URL%hero/parchment-reveal.webm" data-mp4="%BASE_URL%hero/parchment-reveal.mp4"></video>
      </div>
    </div>
    <div class="abundance-scrim abundance-scrim--front" aria-hidden="true"></div>

    <div class="topbar">
      <a class="abundance-wordmark lg" href="#home" aria-label="Urbanrise The Lifescape home"
        data-lg='{"scale":23,"depth":14,"blur":1,"chroma":0.07}'>
        <img class="c" src="%BASE_URL%lifescape-logo.webp" alt="" width="640" height="149">
      </a>
      <nav class="navpill lg" aria-label="Primary" data-lg='{"scale":25,"depth":14}'>
        <span class="navthumb lg" aria-hidden="true" data-lg='{"scale":20,"depth":11,"blur":0,"chroma":0.14,"edge":0.95}'></span>
        <div class="c">
          <a href="#home" aria-current="location">Home</a>
          <a href="#living-wave">The Living Wave</a>
          <a href="#gallery">Gallery</a>
          <a href="#release">Abundance</a>
          <a href="#benchmarks">Benchmarks</a>
          <a href="#lineup">Residences</a>
          <a href="#carbon-calculator">Calculator</a>
        </div>
      </nav>
      <button class="iconbtn lg menu-toggle" id="menuToggle" type="button"
        aria-expanded="false" aria-controls="ov-menu" aria-label="Open menu"
        data-lg='{"scale":21,"depth":12}'>
        <span class="c" aria-hidden="true"><span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span></span>
      </button>
      <nav class="header-menu lg" id="ov-menu" aria-label="More navigation" hidden inert
        data-lg='{"scale":24,"blur":5,"edge":0.95}'>
        <div class="c">
          <a href="#home">Home</a>
          <a href="#living-wave">The Living Wave</a>
          <a href="#gallery">Gallery</a>
          <a href="#release">Abundance</a>
          <a href="#benchmarks">Benchmarks</a>
          <a href="#version">Home check</a>
          <a href="#lineup">Explore Residences</a>
          <a href="#carbon-calculator">Calculator</a>
          <a href="#vision">The story of Abundance</a>
          <a class="menu-access" href="#access">Register Interest
            <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
        </div>
      </nav>
    </div>

    <div class="abundance-copy">
      <div>
        <p class="abundance-project">The Lifescape</p>
        <h1 class="abundance-title" id="hero-title">
          <span class="abundance-title-line"><span>A Life of</span></span>
          <span class="abundance-title-line"><span>Abundance</span></span>
        </h1>
        <div class="abundance-actions">
          <a class="abundance-action lg" href="#access" data-lg='{"scale":24,"depth":13}'>
            <span class="c">Register Interest <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></span>
          </a>
          <a class="abundance-link lg" href="#lineup" data-lg='{"scale":18,"depth":12}'>
            <span class="c">Explore Residences</span>
          </a>
        </div>
      </div>
      <a class="abundance-scroll lg" href="#living-wave" aria-label="Explore The Living Wave" data-lg='{"scale":20,"depth":14}'>
        <span class="c"><svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></span>
      </a>
    </div>
    <div class="abundance-opening" aria-hidden="true">
      <div class="abundance-paper abundance-paper--left"></div>
      <div class="abundance-paper abundance-paper--right"></div>
    </div>
  </header>
  </div>
  <main id="experience" data-gallery-theme="champagne-gold"></main>
  <!-- CUSTOM_FOOTER -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
